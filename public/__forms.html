<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify finds forms by parsing the HTML it has at deploy time. The real
      contact form is rendered by React and is not in that HTML, so this static
      copy exists purely to be found. The field names must stay in step with
      src/components/ContactForm.tsx, and the live form POSTs to this file.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
